<div class="row rsidebar-content">
	<div id="rsidebar-float" class="rsidebar-float">
		<div class="rsidebar-tabs" role="tablist">
			<button type="button" class="rsidebar-tab is-active" data-panel="aside" role="tab" aria-selected="true">关于</button>
			<button type="button" class="rsidebar-tab rsidebar-tab-toc" data-panel="toc" role="tab" aria-selected="false">目录</button>
		</div>
		<div class="rsidebar-panels">
			<div id="rsidebar-aside" class="rsidebar-panel is-active" data-panel="aside" role="tabpanel">

				<section class="rsidebar-block rsidebar-media">
					<a href="/img/ercode/money.jpg"><img src="/img/ercode/money.jpg" alt=""></a>
				</section>

				<section class="rsidebar-block rsidebar-search">
					<form action="https://www.google.com/search" class="searchform" method="get" name="searchform" target="_blank">
						<input name="sitesearch" type="hidden" value="lijiaocn.com">
						<input autocomplete="on" class="form-controls search" name="q" placeholder="站内搜索" required="required" type="text">
						<button class="button" type="submit">Google</button>
					</form>
					<script type="text/javascript">(function(){document.write(unescape('%3Cdiv id="bdcs"%3E%3C/div%3E'));var bdcs = document.createElement('script');bdcs.type = 'text/javascript';bdcs.async = true;bdcs.src = 'http://znsv.baidu.com/customer_search/api/js?sid=9223757389429746735' + '&plate_url=' + encodeURIComponent(window.location.href) + '&t=' + Math.ceil(new Date()/3600000);var s = document.getElementsByTagName('script')[0];s.parentNode.insertBefore(bdcs, s);})();</script>
				</section>

				<section class="rsidebar-block rsidebar-related">
					{% for tag in site.tags %}
						{% for subtag in page.tags %}
							{% if subtag == tag[0] %}
							<div class="rsidebar-related-group">
								<p class="rsidebar-related-title">{{ subtag }}</p>
								<ol class="rsidebar-related-list">
								{% for post in tag[1] %}
									<li><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></li>
								{% endfor %}
								</ol>
							</div>
							{% endif %}
						{% endfor %}
					{% endfor %}
				</section>

			</div>
			<div id="rsidebar-toc" class="rsidebar-panel" data-panel="toc" role="tabpanel"></div>
		</div>
	</div>
</div>
